<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ form_title }} | Student Hub</title>
    <style>
        :root { --ink: #172033; --muted: #6b7280; --blue: #3157d5; --navy: #172b63; --pale: #f4f7ff; --line: #e2e7f0; }
        * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--pale); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
        .topbar { padding: 18px max(22px, calc((100% - 1080px) / 2)); color: white; background: var(--navy); } .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; } .mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 9px; background: #5275ef; }
        .wrap { width: min(100% - 36px, 840px); margin: 42px auto; } .back { display: inline-block; margin-bottom: 20px; color: var(--blue); font-size: 14px; font-weight: 700; } .card { border: 1px solid var(--line); border-radius: 13px; padding: clamp(22px, 5vw, 42px); background: white; box-shadow: 0 12px 30px rgba(23,43,99,.07); } h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); } .intro { margin: 9px 0 30px; color: var(--muted); font-size: 14px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 18px; } label { display: block; margin-bottom: 8px; color: #3f4a60; font-size: 13px; font-weight: 750; } input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px 13px; color: var(--ink); background: #fcfdff; font: inherit; outline: none; } input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #e7ecff; } .errorlist { margin: 7px 0 0; padding: 0; color: #c9364c; list-style: none; font-size: 12px; }
        .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 32px; } .button { display: inline-flex; justify-content: center; border: 0; border-radius: 8px; padding: 12px 18px; font: inherit; font-size: 14px; font-weight: 750; cursor: pointer; } .primary { color: white; background: var(--blue); box-shadow: 0 7px 16px rgba(49,87,213,.18); } .secondary { color: var(--ink); background: white; border: 1px solid var(--line); }
        @media (max-width: 580px) { .grid { grid-template-columns: 1fr; gap: 17px; } .actions { flex-direction: column-reverse; } .button { width: 100%; } }
    </style>
</head>
<body>
<header class="topbar"><a class="brand" href="{% url 'student_list' %}"><span class="mark">SM</span> Student Hub</a></header>
<main class="wrap"><a class="back" href="{% url 'student_list' %}">&#8592; Back to dashboard</a><section class="card"><h1>{{ form_title }}</h1><p class="intro">Enter the student details below. All fields are required.</p><form method="post" novalidate>{% csrf_token %}<div class="grid">
    {% for field in form %}<div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
</div><div class="actions"><a class="button secondary" href="{% url 'student_list' %}">Cancel</a><button class="button primary" type="submit">{% if student %}Save Changes{% else %}Save Student{% endif %}</button></div></form></section></main>
</body>
</html>
